name: E-Commerce Automation Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify code syntax
        run: |
          python -m py_compile tests/smoke/*.py
          python -m py_compile tests/functional/*.py
          python -m py_compile pages/*.py
          python -m py_compile config/*.py
          python -m py_compile utils/*.py

      - name: Test Summary
        run: |
          echo "Code verification passed!"
          echo "Total tests: 7 (3 smoke + 4 functional)"
          echo "Framework: Selenium + Pytest + Page Object Model"